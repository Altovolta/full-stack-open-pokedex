name: Cron Healthcheck

on:
  schedule:
    - cron: "15 * * * *"

jobs:
  cron_healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service is working
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ secrets.APP_URL }}
          max-attempts: 5 
          retry-delay: 5s 